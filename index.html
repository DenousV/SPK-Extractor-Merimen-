<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPK Extractor - JASA & PART</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#66707c;--bd:#d9dee5;--ac:#1f5fbf;--acx:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mu:#95a0ad;--bd:#343b44;--ac:#5b9bff;--acx:#0b1a30}}
:root[data-theme="dark"]{--bg:#14171b;--card:#1d2127;--tx:#e8ebef;--mu:#95a0ad;--bd:#343b44;--ac:#5b9bff;--acx:#0b1a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:20px;margin:0 0 4px}
p.s{color:var(--mu);margin:0 0 16px}
#drop{border:2px dashed var(--bd);border-radius:12px;padding:28px 16px;text-align:center;background:var(--card);cursor:pointer}
#drop.o{border-color:var(--ac)}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:6px 12px;cursor:pointer}
button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:14px}
.card h2{font-size:14px;margin:0 0 8px;word-break:break-all}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
textarea{width:100%;min-height:74px;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit;resize:vertical}
.np{font-size:22px;font-weight:700;letter-spacing:.04em}
.card h2{font-weight:400;color:var(--mu)}
.bar{display:flex;justify-content:flex-end;margin-top:10px}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.w{color:#b3261e;font-size:13px;margin-top:6px}
</style>
</head>
<body>
<main>
<h1>SPK Extractor: JASA &amp; PART</h1>
<p class="s">Untuk gue ambil JASA dan PART karna Bapak SetiyontoL banyak maunya.</p>
<div id="drop">Drag SPK dari Merimen Kesini<br><small style="color:var(--mu)">Bisa lebih dari satu file</small>
<input id="f" type="file" accept="application/pdf" multiple hidden></div>
<div class="bar"><button id="clr">Clear</button></div>
<div id="out"></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}
const $=id=>document.getElementById(id);
const drop=$("drop"),fi=$("f"),out=$("out");
drop.onclick=()=>fi.click();
drop.ondragover=e=>{e.preventDefault();drop.classList.add("o")};
drop.ondragleave=()=>drop.classList.remove("o");
drop.ondrop=e=>{e.preventDefault();drop.classList.remove("o");run(e.dataTransfer.files)};
fi.onchange=()=>run(fi.files);
$("clr").onclick=()=>{out.innerHTML="";fi.value=""};

const KEEP_UP=/^(B\/P|S\/R|LH|RH|FR|RR|LED|ABS|AC|CD)$/i;
function cap(w){return w.charAt(0).toUpperCase()+w.slice(1).toLowerCase()}
const UP=/^(AC|LED|ABS|CD)$/i;
function title(s){
  return s.replace(/\*/g,"").replace(/\s+/g," ").trim().split(" ").map(w=>{
    if(/^[A-Za-z]\/[A-Za-z]$/.test(w)||UP.test(w))return w.toUpperCase();
    return w.split("/").map(cap).join("/");
  }).join(" ");
}
function dedupe(a){const s=new Set();return a.filter(x=>{const k=x.toLowerCase();if(!x||s.has(k))return false;s.add(k);return true})}
function stripParen(s){for(let i=0;i<4;i++)s=s.replace(/\([^()]*\)/g," ");return s}
const isEmpty=v=>!/[1-9]/.test(v||"");
const NOISE=/^(PT Asuransi|F=Franchise|No\.?\s+(Qty|Particulars)|Jasa\s+Repairer|Item Jasa|Tambahan|Particulars|<\s*END)/i;
function sec(lines,sRe,eRe){
  const a=lines.findIndex(l=>sRe.test(l));if(a<0)return [];
  const b=lines.findIndex((l,i)=>i>a&&eRe.test(l));
  return lines.slice(a+1,b<0?undefined:b).filter(l=>!NOISE.test(l));
}
function rowsOf(lines,re){
  const rows=[];let exp=1,cur=null;
  for(const l of lines){
    const m=l.match(re);
    if(m){const n=+m[1];if(n>=exp&&n<=exp+2){cur={m,extra:[]};rows.push(cur);exp=n+1;continue}}
    if(cur)cur.extra.push(l);
  }
  return rows;
}
const COND=/\s+(?:Bent|Damaged|Damage|Missing|Scratched|Broken|Cracked|Dented|Torn|Worn|Rusty|Faded|Melted|Burnt)$/i;
function parse(text){
  const lines=text.split("\n").map(l=>l.replace(/\s+/g," ").trim()).filter(Boolean);
  const parts=[],jasa=[];
  for(const r of rowsOf(sec(lines,/Recommended Parts/i,/^Total Parts|Recommended Item Lain/i),/^(\d{1,3})\s+(\d{1,3})\s+(?:[A-Z0-9-]+\s+)?\*\s*(.*)$/)){
    const all=stripParen([r.m[3],...r.extra].join(" "));
    if(!+r.m[2]||!/\d[\d,]*\d\s*F\b/.test(all))continue;
    const n=stripParen(r.m[3]).replace(/\s+(?:Y|-)\s+\d[\d,]*\s*F\b.*$/,"").replace(COND,"");
    parts.push(title(n));
  }
  for(const r of rowsOf(sec(lines,/Recommended Jasa/i,/Material\s*:|Labour Cost/i),/^(\d{1,2})\s+(\S.*)$/)){
    const all=stripParen([r.m[2],...r.extra].join(" ")).replace(/\s+/g," ").trim();
    const AMT="(?:\\d{1,3}(?:,\\d{3})+|0|-)";
    const am=all.match(new RegExp("(?:^|\\s)([A-Za-z][A-Za-z\\/]*)\\s+("+AMT+")\\s+("+AMT+")(?=\\s|$)"));
    if(!am||isEmpty(am[3]))continue;
    const n=stripParen(r.m[2]).replace(new RegExp("\\s+[A-Za-z][A-Za-z\\/]*\\s+"+AMT+"\\s+"+AMT+"(?=\\s|$).*$"),"").replace(/\bk\d\b/gi," ");
    jasa.push(title(n));
  }
  const np=text.replace(/\s+/g," ").match(/Nomor Polisi\s*:?\s*([A-Z]{1,2}\s*\d{1,4}\s*[A-Z]{0,3})/);
  return{jasa:dedupe(jasa),parts:dedupe(parts),nopol:np?np[1].replace(/\s+/g,""):""};
}
async function readPdf(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    const c=await (await pdf.getPage(p)).getTextContent();
    const it=c.items.filter(x=>x.str&&x.str.trim()).map(x=>({s:x.str.trim(),x:x.transform[4],y:x.transform[5]}));
    it.sort((a,b)=>b.y-a.y||a.x-b.x);
    let line=[],ly=0;
    const flush=()=>{if(line.length){line.sort((a,b)=>a.x-b.x);out.push(line.map(t=>t.s).join(" "))}line=[]};
    for(const t of it){if(line.length&&Math.abs(t.y-ly)>3)flush();if(!line.length)ly=t.y;line.push(t)}
    flush();
  }
  return out.join("\n");
}
function box(label,val){
  const id="t"+Math.random().toString(36).slice(2);
  return `<label>${label}</label><textarea id="${id}">${val.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</textarea><div class="r"><span></span><button class="p" data-c="${id}">Copy</button></div>`;
}
async function run(files){
  for(const f of files){
    const c=document.createElement("div");c.className="card";
    c.innerHTML=`<h2>${f.name.replace(/</g,"&lt;")}</h2><div>Memproses...</div>`;
    out.prepend(c);
    try{
      const raw=await readPdf(f);const {jasa,parts,nopol}=parse(raw);
      c.innerHTML=`<div class="np">${nopol||"Nopol tidak terbaca"}</div><h2>${f.name.replace(/</g,"&lt;")}</h2>`+
        (jasa.length+parts.length?"":`<div class="w">Item JASA/PART tidak terbaca. Cek apakah PDF-nya hasil scan atau formatnya beda.</div>`)+
        box(`JASA (${jasa.length})`,jasa.join(", "))+
        box(`PART (${parts.length})`,parts.join(", "))+
        `<details style="margin-top:10px"><summary style="cursor:pointer;color:var(--mu);font-size:13px">Teks terbaca dari PDF</summary><textarea readonly style="min-height:160px;font:12px monospace">${raw.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</textarea></details>`;
    }catch(e){c.innerHTML=`<h2>${f.name}</h2><div class="w">Gagal membaca file: ${e.message}</div>`}
  }
  fi.value="";
}
out.addEventListener("click",e=>{
  const b=e.target.closest("button[data-c]");if(!b)return;
  const t=$(b.dataset.c);t.select();
  (navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).catch(()=>document.execCommand("copy")).finally(()=>{b.textContent="Tersalin";setTimeout(()=>b.textContent="Copy",1200)});
});
</script>
</body>
</html>
